name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        if: matrix.php == '8.4'
        run: node --check assets/checkout.js
      - name: Versions match
        if: matrix.php == '8.4'
        run: |
          header=$(grep -Po '^ \* Version:\s*\K\S+' kontoros-company-lookup.php)
          const=$(grep -Po "KONTOROS_CL_VERSION', '\K[^']+" kontoros-company-lookup.php)
          stable=$(grep -Po '^Stable tag:\s*\K\S+' readme.txt)
          echo "header=$header constant=$const stable=$stable"
          test "$header" = "$const" && test "$header" = "$stable"
